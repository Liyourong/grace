# Local cluster: image loaded with `minikube image load grace:local`, reached via port-forward on :8090.
resources:
  - ../base
images:
  - name: grace
    newName: grace
    newTag: local
# Let the rehearsal return to its two-Pod starting point between demonstrations.
patches:
  - patch: |-
      apiVersion: autoscaling/v2
      kind: HorizontalPodAutoscaler
      metadata: { name: app }
      spec:
        behavior:
          scaleDown:
            stabilizationWindowSeconds: 60
