# DigitalOcean Kubernetes. SITE_HOST / APP_ORIGINS are the sslip.io name of the caddy LoadBalancer IP;
# after changing them, `kubectl apply -k` rolls app and caddy automatically (hashed ConfigMap names).
namespace: grace
resources:
  - ../base
  - caddy.yaml
  - backup.yaml
images:
  - name: grace
    newName: registry.digitalocean.com/grace-dev/grace
    newTag: v3
configMapGenerator:
  - name: grace-config
    behavior: merge
    literals:
      - SITE_HOST=146-190-191-107.sslip.io
      - APP_ORIGINS=https://146-190-191-107.sslip.io
      - COOKIE_SECURE=true
  - name: caddyfile
    files:
      - Caddyfile
  - name: backup-script
    files:
      - backup.sh
patches:
  - patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: app
      spec:
        template:
          spec:
            containers:
              - name: grace
                env:
                  - name: SENDGRID_API_KEY
                    valueFrom:
                      secretKeyRef: { name: grace-sendgrid, key: SENDGRID_API_KEY, optional: false }
                  - name: SENDGRID_FROM_EMAIL
                    valueFrom:
                      secretKeyRef: { name: grace-sendgrid, key: SENDGRID_FROM_EMAIL, optional: false }
                  - name: GRACE_EXPLAIN_URL
                    valueFrom:
                      secretKeyRef: { name: grace-explain, key: GRACE_EXPLAIN_URL }
                  - name: GRACE_EXPLAIN_TOKEN
                    valueFrom:
                      secretKeyRef: { name: grace-explain, key: GRACE_EXPLAIN_TOKEN }
  # Retain: deleting the PVC by mistake keeps the DO volume (and the data) instead of destroying it.
  - target: { kind: StatefulSet, name: db }
    patch: |-
      - op: add
        path: /spec/volumeClaimTemplates/0/spec/storageClassName
        value: do-block-storage-retain
