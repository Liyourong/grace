# Advanced feature: auto-scaling. Needs metrics-server: `minikube addons enable metrics-server`, or on DOKS
# `doctl kubernetes 1-click install <cluster-id> --1-clicks metrics-server` (DOKS does not ship it).
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: app
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: app }
  minReplicas: 2
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: { type: Utilization, averageUtilization: 70 }
