apiVersion: v1
kind: ServiceAccount
metadata: { name: grace-dashboard }
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata: { name: grace-dashboard-nodes }
rules:
  - apiGroups: [""]
    resources: [nodes]
    verbs: [list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata: { name: grace-dashboard-nodes }
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: grace-dashboard-nodes }
subjects: [{ kind: ServiceAccount, name: grace-dashboard, namespace: grace }]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata: { name: grace-dashboard }
rules:
  - apiGroups: [""]
    resources: [pods, services, persistentvolumeclaims]
    verbs: [list, watch]
  - apiGroups: [""]
    resources: [pods/log]
    verbs: [get]
  - apiGroups: [discovery.k8s.io]
    resources: [endpointslices]
    verbs: [list, watch]
  - apiGroups: [apps]
    resources: [deployments]
    verbs: [list, watch]
  - apiGroups: [autoscaling]
    resources: [horizontalpodautoscalers]
    verbs: [list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: { name: grace-dashboard }
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: Role, name: grace-dashboard }
subjects: [{ kind: ServiceAccount, name: grace-dashboard, namespace: grace }]
